            <text x="205" y="388" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="10" fill="#4E3B30">Bordeaux</text>

            <!-- Bank labels -->
            <text x="115" y="445" font-family="'Cormorant SC',serif" font-size="9" letter-spacing="3" fill="#8A7565" opacity="0.6">RIVE GAUCHE</text>
            <text x="400" y="325" font-family="'Cormorant SC',serif" font-size="9" letter-spacing="3" fill="#8A7565" opacity="0.6">RIVE DROITE</text>

          </svg>
