<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="gironde" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8FA7B8" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#6B8A9E" stop-opacity="0.55"/>
              </linearGradient>
            </defs>

            <!-- France silhouette for context (faint, no fill) -->
            <g transform="translate(-220,-280) scale(1.7)" opacity="0.2">
              <path d="M 200,60 L 280,50 L 340,80 L 400,100 L 430,160 L 460,220 L 470,300 L 450,380 L 410,440 L 360,490 L 280,510 L 200,495 L 140,460 L 100,400 L 80,320 L 90,240 L 120,160 L 160,100 Z"
                fill="none" stroke="var(--gold)" stroke-width="0.6" stroke-dasharray="4 3"/>
              <!-- Marker showing Bordeaux position within France -->
              <circle cx="148" cy="368" r="18" fill="none" stroke="var(--oxblood)" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.6"/>
            </g>

            <!-- Bordeaux region outline -->
            <path class="bordeaux-outline" d="M 80,80 L 240,60 L 400,100 L 480,180 L 500,340 L 460,460 L 340,500 L 180,490 L 80,420 L 60,280 L 60,160 Z"
